# Hackathon 6 - Green Transition Pulse
# Collects new items every hour, scores them with two Hugging Face models,
# and commits the new rows in data/items.csv + data/runs.csv back to the repo.
name: Green Transition Pulse collector

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (GitHub may delay scheduled runs a bit)
  workflow_dispatch:           # "Run workflow" button for a manual round

permissions:
  contents: write

concurrency:
  group: green-pulse
  cancel-in-progress: false

defaults:
  run:
    working-directory: "Term 1/Week 6/hackathon"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Term 1/Week 6/hackathon/requirements.txt"

      - name: Install (CPU-only torch keeps it small)
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-xlmr-robbert-v1

      - name: Collect and score
        run: python collect.py

      - name: Commit new data
        run: |
          git config user.name "green-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.csv data/runs.csv
          git diff --cached --quiet && exit 0
          git commit -m "Green Pulse: collection round $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
